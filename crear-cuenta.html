<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="crear-cuenta.css">
    
</head>
<body>


    <div class="contenedor-sesion">
        <div class="lado-izquierdo">
            <div class="texto">
                <h2>¡Crea tu cuenta!</h2>
                <p>Disfruta de una experiencia personalizada, acceso a ofertas exclusivas y mucho mas.</p>
            </div>
        </div>
        <div class="lado-derecho">
            <div class="contenido">
                <h2>Crear cuenta</h2>
                <p>Completa tus datos para empezar a disfrutar todos los beneficios.</p>
                <form id="form-registro">                  
                    <div class="correo-electronico">
                        <label for="correo">Correo electronico</label>
                        <input type="email" id="correo" placeholder="tucorreo@ejemplo.com">
                    </div>
                    <div class="contrasena">
                        <label for="contraseña">Contraseña</label>
                        <input type="password" id="contraseña" placeholder="Minimo 8 caracteres">
                    </div>
                    <button type="submit">Crear cuenta</button>
                </form>
                <div class="crear-cuenta">
                    <span>¿Ya tienes una cuenta?</span>
                    <a href="inicio-sesion.html">Iniciar sesion</a>
                </div>

            </div>
        </div>
    </div>
    <script src="crear-cuenta.js"></script>
</body>
</html>
