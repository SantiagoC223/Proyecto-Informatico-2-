<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="inicio-sesion.css">
</head>
<body>


    <div class="contenedor-sesion">
        <div class="lado-izquierdo">
            <div class="texto">
                <h2>Bienvenido de nuevo</h2>
                <p>Inicia sesion para continuar comprando tus productos favoritos.</p>
            </div>
        </div>
        <div class="lado-derecho">
            <div class="contenido">
                <h2>Iniciar Sesion</h2>
                <p>Ingresa a tu cuenta para acceder a tus pedidos, lista de deseos y mas.</p>
                <form id="form-login">
                    <div class="correo-electronico">
                        <label for="correo">Correo electronico</label>
                        <input type="email" id="correo" placeholder="tucorreo@ejemplo.com">
                    </div>
                    <div class="contrasena">
                        <label for="contraseña">Contraseña</label>
                        <input type="password" id="contraseña" placeholder="Ingresa tu contraseña">
                    </div>
                    <button type="submit">Iniciar Sesion</button>
                </form>
                <div class="crear-cuenta">
                    <span>¿No Tienes una cuenta?</span>
                    <a href="crear-cuenta.html">Crear Cuenta</a>
                </div>

            </div>
        </div>
    </div>
    <script src="inicio-sesion.js"></script>
</body>

</html>
